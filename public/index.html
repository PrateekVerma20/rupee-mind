<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rupee-Mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#F7F8FA;--card:#FFF;--border:#E6E8EC;--text:#14181F;--text-dim:#6B7280;--accent:#0E7C5A;--accent-light:#E6F4EE;--accent-dark:#0B5F45;--danger:#D64545;--danger-light:#FBEAEA;--radius:12px;--shadow:0 1px 2px rgba(20,24,31,.04),0 4px 12px rgba(20,24,31,.04)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Open Sans',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}#root{max-width:880px;margin:0 auto;padding:40px 24px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em}.sub{color:var(--text-dim);font-size:14px;margin:6px 0 28px}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}.card-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.card-head h2{font-size:15px;font-weight:700;margin:0}.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .15s ease}.btn:hover{background:var(--accent-dark)}.btn:disabled{opacity:.45;cursor:default}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn.ghost:hover{background:#F2F3F5}.center{text-align:center;padding:56px 24px}.center p{color:var(--text-dim);font-size:13px;margin:16px auto 0;max-width:360px;line-height:1.6}.row{padding:13px 22px;border-bottom:1px solid #F0F1F3;display:grid;grid-template-columns:110px 1fr 110px 95px;gap:12px;align-items:center;font-size:13.5px}.row:last-child{border-bottom:none}.row:hover{background:#FAFBFC}.amt{font-weight:700;text-align:right}.merchant{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.date{color:var(--text-dim);font-size:12px;text-align:right}.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;text-align:center;background:var(--accent-light);color:var(--accent-dark);display:inline-block}.tag.empty{background:#F0F1F3;color:var(--text-dim)}.status{font-size:13px;font-weight:500;padding:12px 22px;color:var(--accent-dark);background:var(--accent-light);display:none}.status.show{display:block}.status.error{color:var(--danger);background:var(--danger-light)}.empty-state{padding:40px 22px;text-align:center;color:var(--text-dim);font-size:13.5px}@media(max-width:700px){#root{padding:24px 14px}.row{grid-template-columns:90px 1fr 90px}.date{display:none}}
  </style>
</head>
<body>
  <div id="root">
    <div class="brand"><div class="brand-mark">R</div><h1>Rupee-Mind</h1></div>
    <div class="sub">Automatic Gmail bank-alert sync, spend categorization, and subscription-leak detection</div>
    <div class="card" id="auth-panel"><div class="card-head"><h2>Get started</h2></div><div class="center" id="auth-area"><button class="btn" id="login-btn">Sign in with Google</button><p>Requests read-only Gmail access to sync bank alert emails. Nothing is sent on your behalf — only read.</p></div></div>
    <div class="card" id="data-panel" style="display:none;"><div class="card-head"><h2>Transactions</h2><div style="display:flex;gap:8px;"><button class="btn" id="sync-btn">Sync Gmail</button><button class="btn ghost" id="logout-btn">Sign out</button></div></div><div id="status" class="status"></div><div id="feed"></div></div>
  </div>
  <script>
    const SUPABASE_URL="https://otnjtrupjqhlgjpunqvu.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bmp0cnVwanFobGdqcHVucXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzM4OTgsImV4cCI6MjEwNTA0OTg5OH0.ywmOJYzKZyGk8VbifBAuHYTkLscEHfRGREomngbHIN0";
    const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    let currentSession=null;
    function setStatus(text,isError){const el=document.getElementById("status");el.textContent=text;el.classList.toggle("show",!!text);el.classList.toggle("error",!!isError)}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[ch]))}
    function renderTransactions(transactions){const feed=document.getElementById("feed");if(!transactions||transactions.length===0){feed.innerHTML='<div class="empty-state">No transactions yet — click "Sync Gmail" to pull recent bank alerts.</div>';return}feed.innerHTML="";transactions.forEach(t=>{const row=document.createElement("div");row.className="row";const tag=t.category?`<span class="tag">${escapeHtml(t.category)}</span>`:'<span class="tag empty">Uncategorized</span>';row.innerHTML=`<div class="amt">₹${Math.abs(Number(t.amount)).toLocaleString("en-IN")}</div><div class="merchant">${escapeHtml(t.merchant||"Unknown")}</div><div>${tag}</div><div class="date">${escapeHtml(t.transaction_date||"")}</div>`;feed.appendChild(row)})}
    async function loadTransactions(){setStatus("Loading transactions…");try{const res=await fetch("/api/transactions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:currentSession.access_token})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Request failed");setStatus("");renderTransactions(data.transactions||[])}catch(err){console.error(err);setStatus("Couldn't load transactions.",true)}}
    document.getElementById("login-btn").addEventListener("click",async()=>{const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{scopes:"https://www.googleapis.com/auth/gmail.readonly",queryParams:{access_type:"offline",prompt:"consent"}}});if(error)setStatus(error.message,true)});
    document.getElementById("logout-btn").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});
    document.getElementById("sync-btn").addEventListener("click",async()=>{const btn=document.getElementById("sync-btn");btn.disabled=true;setStatus("Syncing Gmail… this reads recent bank alert emails.");try{const{data:{session}}=await sb.auth.getSession();if(!session?.provider_token){setStatus("Gmail access expired — sign out and sign in again to re-grant access.",true);return}const res=await fetch("/api/sync-gmail",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:session.access_token,provider_token:session.provider_token})});const data=await res.json();if(!res.ok)throw new Error(data.error||"Sync failed");setStatus(`Synced ${data.synced??0} transaction(s).`);await loadTransactions()}catch(err){console.error(err);setStatus("Sync failed — check the browser console and Vercel logs.",true)}finally{btn.disabled=false}});
    async function init(){const{data:{session}}=await sb.auth.getSession();if(session){currentSession=session;document.getElementById("auth-panel").style.display="none";document.getElementById("data-panel").style.display="block";await loadTransactions()}}init();
  </script>
</body>
</html>
